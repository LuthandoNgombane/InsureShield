<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsureShield - My Active Policies</title>
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
    
    </header>

    <!-- Main Content Layout -->
    <main class="main-content container">
      <section class="hero-section">
        <h1>Active Policy Dashboard</h1>
        <p class="subtitle">Monitor active micro-insurance coverage, countdowns, and submit AI claims.</p>
      </section>

      <div class="card filter-bar" style="margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
        <div style="flex: 1; min-width: 200px;">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search policies by ID or description..." 
            style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"
          />
        </div>
        <div>
          <select id="status-filter" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="All">All Statuses</option>
            <option value="Active">Active Only</option>
            <option value="Expired">Expired Only</option>
          </select>
        </div>
      </div>


      <!-- Dashboard Cards Container -->
      <div id="policies-dashboard"></div>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
      
    </footer>

    <!-- Entry script for the dashboard -->
    <script type="module" src="/src/js/policyDashboard.js"></script>
  </body>
</html>
