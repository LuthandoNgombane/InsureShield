<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsureShield - Micro-Insurance Calculator</title>
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
     
    </header>

    <!-- Main Content Layout -->
    <main class="main-content container">
      <section class="hero-section">
        <h1>AI-Powered Micro-Insurance Quotes</h1>
        <p class="subtitle">Instant risk evaluation and premium calculations for your valuables.</p>
      </section>

      <div class="calculator-grid">
        <!-- Quote Form Card -->
        <div class="card">
          <h2>Get Quick Quote</h2>
          <form id="quick-quote-form">
            <div class="form-group">
              <label for="item-category">Item Category</label>
              <select id="item-category" required>
                <option value="">Select Category...</option>
                <option value="Laptop">Laptop / Computer</option>
                <option value="Camera">Camera / Photography</option>
                <option value="Musical Instrument">Musical Instrument</option>
                <option value="Smartphone">Smartphone / Tablet</option>
                <option value="Other">Other Equipment</option>
              </select>
            </div>

            <div class="form-group">
              <label for="item-description">Description & Condition</label>
              <textarea id="item-description" rows="3" placeholder="e.g., MacBook Pro M2 in hard case, excellent condition..." required></textarea>
            </div>

            <div class="form-group">
              <label for="item-value">Declared Value</label>
              <input type="number" id="item-value" min="10" step="10" placeholder="1200" required />
            </div>

            <div class="form-group">
              <label for="currency-select">Display Currency</label>
              <select id="currency-select">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="ZAR">ZAR (R)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="item-usecase">Usage Scenario</label>
              <select id="item-usecase" required>
                <option value="Local Indoor Studio">Local Indoor Studio</option>
                <option value="Daily Commute">Daily Commute</option>
                <option value="Outdoor Event / Gig">Outdoor Event / Gig</option>
                <option value="International Travel">International Travel</option>
              </select>
            </div>

            <div class="form-group">
              <label for="item-duration">Coverage Duration (Days)</label>
              <input type="number" id="item-duration" min="1" max="365" value="7" required />
            </div>

            <button type="submit" class="btn btn-primary full-width">Calculate AI Quote</button>
          </form>
        </div>

        <!-- Result Card Container -->
        <div class="card">
          <h2>Quote Assessment</h2>
          <div id="quote-result-container" class="result-placeholder">
            <div class="empty-state">
              <p>Fill in the item details and submit to generate your custom AI risk evaluation and coverage quote.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
     
    </footer>

    <!-- Vite Entry Script -->
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
